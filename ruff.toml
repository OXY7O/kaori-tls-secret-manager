# Gradual, low-noise Ruff adoption: only changed Python files are checked in CI.
# Extend the rule set deliberately once legacy findings are remediated.
target-version = "py310"
line-length = 100

[lint]
select = [
  "E4", "E7", "E9",       # Import, statement, and syntax-related errors
  "F601", "F602",         # Duplicate dictionary keys
  "F632",                 # Invalid identity checks on literals
  "F811",                 # Redefined symbols
  "F821", "F822", "F823"  # Undefined names / invalid local bindings
]
