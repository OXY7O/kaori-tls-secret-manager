name: KAORI Reviewed CodeQL Triage (One Time)

# Only the reviewed change to this workflow triggers the single execution.
# A single status-only retry diagnoses a blocked Code Scanning PATCH.
# Remove this workflow after the audited disposition results are verified.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reviewed-codeql-triage.yml

permissions:
  contents: read

jobs:
  reviewed_alert_disposition:
    name: Reviewed CodeQL Alert Disposition
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout reviewed repository source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify reviewed alert identities and record decisions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/reviewed_codeql_dispositions.py
