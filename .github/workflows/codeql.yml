name: KAORI Code Scanning

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Monday 09:15 WIB (02:15 UTC)
    - cron: "15 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze and upload results
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: codeql-sarif
      - name: Build metadata-only SARIF triage index
        run: |
          python3 scripts/ci/sarif_triage.py \
            --input codeql-sarif \
            --output codeql-sarif/triage-summary.json
      - name: Archive CodeQL SARIF and triage evidence
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-sarif/
          if-no-files-found: error
          retention-days: 14

  open_alert_inventory:
    name: CodeQL Alert Inventory
    if: github.event_name != 'pull_request'
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Inventory live open alerts (metadata only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/code_scanning_alerts.py
