name: KAORI CI & Release
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  schedule:
    # Weekly baseline Monday 10:00 Asia/Jakarta (03:00 UTC).
    - cron: "0 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality_gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete diff history
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select impact-aware validation
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 scripts/ci/impact_gate.py detect \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --event "$EVENT_NAME" \
            --output "$GITHUB_OUTPUT" \
            --plan "$RUNNER_TEMP/impact-plan.json"
      - name: Setup Python
        if: steps.impact.outputs.mode != 'docs'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Full syntax validation for runtime/security changes
        if: steps.impact.outputs.run_syntax == 'true'
        run: |
          python3 -m py_compile scripts/tls_crud.py \
            scripts/kubernetes/tls-secret-manager/tls_secret_manager.py \
            scripts/kubernetes/tls-secret-manager/tls_secret_wizard.py \
            scripts/kubernetes/tls-secret-manager/tls_inventory.py \
            scripts/kubernetes/tls-secret-manager/tls_ops.py
          bash -n scripts/tls-secret-manager.sh scripts/kaori-tls-secret-manager.sh \
            scripts/kubernetes/tls-secret-manager/tls-secret-manager.sh
      - name: Selected or full synthetic regression
        run: |
          python3 scripts/ci/impact_gate.py test \
            --plan "$RUNNER_TEMP/impact-plan.json"
      - name: Full CLI smoke tests for runtime/security changes
        if: steps.impact.outputs.run_smoke == 'true'
        run: |
          bash scripts/tls-secret-manager.sh doctor
          bash scripts/tls-secret-manager.sh --help
          bash scripts/tls-secret-manager.sh crud --help
          bash scripts/tls-secret-manager.sh wizard --help
      - name: Cluster Isolation (always)
        run: |
          test -z "${KUBECONFIG:-}"
          echo 'No real cluster or Secret write permitted in CI.'

  publish_release:
    name: Publish Release
    needs: quality_gate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    concurrency:
      group: kaori-source-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Package & Verify
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n '1p' VERSION)"
          if ! [[ "${VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::VERSION must be a SemVer MAJOR.MINOR.PATCH public release"
            exit 1
          fi
          grep -F "## [${VERSION}]" CHANGELOG.md
          test -f "docs/releases/v${VERSION}.md"
          test -f assets/kaori-logo.png
          test -f assets/kaori-mark.png
          test "${GITHUB_REF}" = "refs/heads/main"
          mkdir -p dist
          ARCHIVE="kaori-tls-management-v${VERSION}.tar.gz"
          git archive --format=tar.gz --prefix="kaori-tls-management-v${VERSION}/" \
            --output="dist/${ARCHIVE}" HEAD
          tar -tzf "dist/${ARCHIVE}" >/dev/null
          ( cd dist && sha256sum "${ARCHIVE}" > SHA256SUMS )
      - name: Publish Tag & Checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n '1p' VERSION)"
          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; immutable release will not be replaced."
            exit 0
          fi
          gh release create "${TAG}" \
            "dist/kaori-tls-management-${TAG}.tar.gz" dist/SHA256SUMS \
            --target "${GITHUB_SHA}" \
            --title "KAORI TLS Management ${TAG}" \
            --notes-file "docs/releases/${TAG}.md"
