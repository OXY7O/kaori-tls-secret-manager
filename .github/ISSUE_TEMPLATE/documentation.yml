name: Documentation improvement
description: Report inaccurate instructions or propose clearer operator guidance
title: "docs: "
body:
  - type: input
    id: location
    attributes:
      label: Page or file
      placeholder: docs/COMMAND-REFERENCE.md
    validations:
      required: true
  - type: textarea
    id: confusion
    attributes:
      label: What is incorrect or unclear?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Suggested correction
  - type: checkboxes
    id: safety
    attributes:
      label: Content safety
      options:
        - label: No private key, credential or confidential cluster identifier is included
          required: true
